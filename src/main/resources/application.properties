# Server
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# The Racing API (https://api.theracingapi.com)
# MCP server: https://mcp.theracingapi.com
# Set your credentials from https://www.theracingapi.com/dashboard
racing-api.base-url=https://api.theracingapi.com/v1
racing-api.username=${RACING_API_USERNAME:}
racing-api.password=${RACING_API_PASSWORD:}
